services:
    database:
        container_name: ${CONTAINER_NAME}-database
        image: mysql:8.0
        restart: unless-stopped
        env_file: .env
        environment:
            MYSQL_DATABASE: ${DATABASE_NAME}
            MYSQL_PASSWORD: ${DATABASE_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
            MYSQL_USER: ${DATABASE_USER}
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '-u',
                    'root',
                    '-p$$DATABASE_ROOT_PASSWORD',
                ]
            timeout: 20s
            retries: 10
        ports:
            - '${DATABASE_PORT}:${DATABASE_PORT}'
        volumes:
            - dbdata_volume:/var/lib/mysql
        networks:
            - app-network

    # database management
    phpmyadmin:
        container_name: ${CONTAINER_NAME}-phpmyadmin
        image: phpmyadmin/phpmyadmin
        env_file: .env
        environment:
            PMA_HOST: database  # use the same name as database service in docker-compose.yml
            PMA_PORT: ${DATABASE_PORT}
            MYSQL_ROOT_PASSWORD: '${DATABASE_ROOT_PASSWORD}'
        ports:
            - '8081:80'
        networks:
            - app-network

    # application
    wordpress:
        depends_on:
            - database
        container_name: ${CONTAINER_NAME}-wordpress
        image: wordpress:6.5.2-fpm-alpine
        restart: unless-stopped
        env_file: .env
        environment:
            WORDPRESS_DB_HOST: database:${DATABASE_PORT} # use the same name as database service in docker-compose.yml
            WORDPRESS_DB_NAME: '${DATABASE_NAME}'
            WORDPRESS_DB_USER: '${DATABASE_USER}'
            WORDPRESS_DB_PASSWORD: '${DATABASE_PASSWORD}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - wordpress_volume:/var/www/html
            - ./src:/var/www/html/wp-content:rw
        networks:
            - app-network

    webserver:
        depends_on:
            - wordpress
        container_name: ${CONTAINER_NAME}-nginx
        image: nginx:1.19-alpine
        restart: unless-stopped
        env_file: .env
        # See https://hub.docker.com/_/nginx for more information on how to use the official Nginx image.
        # The official Nginx image uses the default Nginx configuration file at /etc/nginx/nginx.conf.
        # or it can be overridden by mounting your own configuration file at /etc/nginx/conf.d/default.conf.
        # Alternatively since nginx 1.19 you can now use environment variables in your configuration with docker-compose.
        # See section using environment variables in nginx configuration (new in 1.19) on how to do so.
        environment:
            NGINX_HOST: ${DOMAIN_NAME}
        ports:
            - '80:80'
            - '443:443'
            - '9000:9000'
        volumes:
            - wordpress_volume:/var/www/html
            - ./nginx/templates:/etc/nginx/templates
            - ./nginx/nginx-conf:/etc/nginx/conf.d
            - certbot-etc_volume:/etc/letsencrypt
        networks:
            - app-network


    certbot:
        depends_on:
            - webserver
        image: certbot/certbot
        container_name: certbot
        env_file: .env
        environment:
            DOMAIN_NAME: ${DOMAIN_NAME}
            WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
        volumes:
            - certbot-etc_volume:/etc/letsencrypt
            - wordpress_volume:/var/www/html

    #     # Uncomment when a you have domain to register available.
    #     # command: certonly --webroot --webroot-path=/var/www/html --email ${WORDPRESS_ADMIN_EMAIL} --agree-tos --no-eff-email --force-renewal -d ${DOMAIN_NAME} -d www.${DOMAIN_NAME}
    #     # # uncomment for if your domain is only a subdomain and comment out hte above command instead.
    #     command: certonly --webroot --webroot-path=/var/www/html --email ${WORDPRESS_ADMIN_EMAIL} --agree-tos --no-eff-email --force-renewal -d ${DOMAIN_NAME}

        networks:
            - app-network



volumes:
    certbot-etc_volume:
    wordpress_volume:
    dbdata_volume:


networks:
    app-network:
        driver: bridge
